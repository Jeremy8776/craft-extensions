[package]
name = "craft-ext-store"
description = "Desktop half of Craft extensions: the shared store, bounded unpacking, installs and the read side for apps."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529", version = "0.1.0" }
craft-ext-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[features]
# Passes the third-party switch through to the core contract. Off by default; see docs/THREAT-MODEL.md.
third-party = ["craft-ext-core/third-party"]

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.27.0"
